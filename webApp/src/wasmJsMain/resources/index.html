<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>애니멀 쉘터</title>
    <meta name="description" content="보호소에 들어온 유기동물 공고를 사진으로 찾아보는 앱이에요.">
    <meta name="robots" content="noindex">
    <!-- 로딩 화면 = 브랜드 원색(4a 검토 F5). 앱이 뜨면 :webApp이 앱 바탕(설정 테마·사진 뷰어)으로 바꾼다 -->
    <meta name="theme-color" content="#0A81AB">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <style>
        html, body { height: 100%; margin: 0; }
        /* 캔버스 앱이라 문서는 스크롤하지 않는다 — 마우스·터치패드에서 고무줄 되튐을 막는다(H5). 터치는 기본 그대로 */
        @media (pointer: fine) { html, body { overscroll-behavior: none; } }
        body { background: #f6fafe; color: #171c1f; font-family: system-ui, sans-serif; }
        @media (prefers-color-scheme: dark) { body { background: #0f1417; color: #dee3e7; } }
        #root { position: relative; z-index: 1; width: 100%; height: 100%; }
        /* 로딩 화면(브리핑 H1): 브랜드 원색 바탕 + 흰 로고 + 작은 원형 표시. 캔버스보다 위, 첫 화면이 그려지면 앱이 없앤다(H2). */
        #loading {
            position: fixed; inset: 0; z-index: 2;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
            padding: 24px; box-sizing: border-box;
            background: #0a81ab; color: #ffffff; text-align: center;
            transition: opacity 150ms ease-out;
        }
        #loading img { width: 160px; height: auto; }
        #loading .spinner {
            width: 24px; height: 24px; box-sizing: border-box;
            border: 3px solid rgba(255, 255, 255, 0.35); border-top-color: #ffffff; border-radius: 50%;
            animation: spin 900ms linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            #loading { transition: none; }
            #loading .spinner { animation: none; }
        }
        #loading.stopped .spinner { display: none; }
        /* 안내 카드(4a 검토 F1, DESIGN.md 웹 셸 안내 카드): surface 바탕 + on-surface 글자 — 브랜드 바탕 위 흰 글자(4.43:1) 대신 */
        .notice {
            box-sizing: border-box; max-width: 32em; padding: 16px; border-radius: 12px;
            background: #f6fafe; color: #171c1f; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            /* 한국어는 어절 단위로 줄을 바꾼다(단어 가운데서 끊지 않게) */
            word-break: keep-all; overflow-wrap: break-word;
        }
        .notice p { margin: 0; font-size: 16px; line-height: 24px; }
        .notice p.sub { color: #40484d; font-size: 14px; line-height: 21px; }
        .notice button {
            margin-top: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 24px;
            background: #1a6585; color: #ffffff; font: 600 14px/20px system-ui, sans-serif; cursor: pointer;
        }
        /* 초점 외곽선은 앱의 카드 초점 링과 같은 secondary(라이트 #4E616D, 다크 #B5C9D7) */
        .notice button:focus-visible { outline: 3px solid #4e616d; outline-offset: 2px; }
        @media (prefers-color-scheme: dark) {
            .notice { background: #0f1417; color: #dfe3e7; }
            .notice p.sub { color: #c0c7cd; }
            .notice button { background: #8ecff2; color: #003548; }
            .notice button:focus-visible { outline-color: #b5c9d7; }
        }
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
    </style>
    <!-- 자바스크립트가 꺼져 있으면 스피너와 "불러오는 중" 상태 문장을 숨기고 noscript 카드만 -->
    <noscript><style>#loading .spinner, #loading-status { display: none; }</style></noscript>
</head>
<body>
<div id="loading">
    <img src="logo_white.png" alt="애니멀 쉘터" width="160" height="143" fetchpriority="high">
    <div class="spinner" aria-hidden="true"></div>
    <div id="loading-status" role="status">
        <span class="sr-only">애니멀 쉘터를 불러오는 중이에요</span>
    </div>
    <noscript>
        <div class="notice">
            <p>자바스크립트를 켜야 열 수 있어요.</p>
            <p class="sub" lang="en">Please turn on JavaScript to use this app.</p>
        </div>
    </noscript>
</div>
<div id="root"></div>
<script>
    // 웹 셸(4a 검토 F1). 첫 화면 알림(H2)이 올 때까지 로딩 화면을 덮어 두고, 상황에 맞는 안내만 한다:
    // ① WasmGC가 없으면 앱을 받지 않고 "이 브라우저에서는 열 수 없어요" ② 10초가 지나면 "아직 불러오는 중"(60초부터
    // [다시 시도]) — 느린 연결은 실패가 아니다 ③ 기능 검사를 통과한 뒤 첫 화면 전의 스크립트 오류·거부된 약속·앱 스크립트
    // 로드 실패는 "불러오지 못했어요" + [다시 시도]. 첫 화면 알림은 어느 안내가 떠 있어도 이긴다.
    (function () {
        var SLOW_MILLIS = 10000;
        var RETRY_MILLIS = 60000;
        var loading = document.getElementById("loading");
        var status = document.getElementById("loading-status");
        var ready = false;
        var failed = false;
        var slowTimer = 0;
        var retryTimer = 0;

        // 타입 절 하나에 빈 struct 타입((type (struct))) — GC를 모르는 엔진은 형식 0x5f를 거부한다
        function supportsWasmGc() {
            try {
                return typeof WebAssembly === "object" && typeof WebAssembly.validate === "function" &&
                    WebAssembly.validate(new Uint8Array([
                        0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00, 0x01, 0x03, 0x01, 0x5f, 0x00
                    ]));
            } catch (e) {
                return false;
            }
        }

        function line(text, className, lang) {
            var p = document.createElement("p");
            if (className) p.className = className;
            if (lang) p.lang = lang;
            p.textContent = text;
            return p;
        }

        function retryButton() {
            var button = document.createElement("button");
            button.type = "button";
            button.appendChild(document.createTextNode("다시 시도 · "));
            var en = document.createElement("span");
            en.lang = "en";
            en.textContent = "Try again";
            button.appendChild(en);
            button.addEventListener("click", function () { location.reload(); });
            return button;
        }

        // 안내 카드를 #loading-status(role="status") 안에 바꿔 넣는다 — 바뀌면 화면 읽기가 읽는다
        function showNotice(lines, withButton) {
            var card = document.createElement("div");
            card.className = "notice";
            for (var i = 0; i < lines.length; i++) card.appendChild(lines[i]);
            if (withButton) card.appendChild(retryButton());
            // replaceChildren는 쓰지 않는다 — ①은 오래된 브라우저에서도 떠야 한다
            while (status.firstChild) status.removeChild(status.firstChild);
            status.appendChild(card);
            return card;
        }

        function stopTimers() {
            clearTimeout(slowTimer);
            clearTimeout(retryTimer);
        }

        function stopListening() {
            window.removeEventListener("error", fail);
            window.removeEventListener("unhandledrejection", fail);
        }

        function showSlow() {
            if (ready || failed) return;
            var card = showNotice([
                line("아직 불러오는 중이에요. 연결이 느리면 1분 넘게 걸릴 수 있어요."),
                line("Still loading. On a slow connection this can take more than a minute.", "sub", "en")
            ], false);
            // 60초: 실패라고 말하지 않고 버튼만 더한다(받은 파일은 브라우저 캐시가 확인만 한다)
            retryTimer = setTimeout(function () {
                if (!ready && !failed) card.appendChild(retryButton());
            }, RETRY_MILLIS - SLOW_MILLIS);
        }

        function fail() {
            if (ready || failed) return;
            failed = true;
            stopTimers();
            stopListening();
            loading.classList.add("stopped");
            showNotice([
                line("앱을 불러오지 못했어요. 연결을 확인하고 다시 시도해 주세요."),
                line("계속 안 되면 최신 Chrome·Edge·Firefox나 Safari 18.2 이상에서 열어 주세요.", "sub"),
                line("Couldn’t load the app. Check your connection and try again, " +
                    "or use the latest Chrome, Edge, Firefox or Safari 18.2+.", "sub", "en")
            ], true);
        }

        // 앱(:webApp)이 첫 화면을 그린 뒤 한 번 부른다. 모션 줄이기면 페이드 없이 바로 없앤다.
        window.animalShelterReady = function (reducedMotion) {
            if (ready) return;
            ready = true;
            stopTimers();
            stopListening();
            if (!loading.parentNode) return;
            if (reducedMotion) { loading.remove(); return; }
            loading.style.opacity = "0";
            setTimeout(function () { loading.remove(); }, 160);
        };

        if (!supportsWasmGc()) {
            // ① 앱 스크립트를 넣지 않는다 — 번들(7.6MB)을 받지 않는다
            loading.classList.add("stopped");
            showNotice([
                line("이 브라우저에서는 열 수 없어요. 최신 Chrome·Edge·Firefox나 Safari 18.2 이상에서 열어 주세요."),
                line("This browser can’t open the app. " +
                    "Please use the latest Chrome, Edge or Firefox, or Safari 18.2 or later.", "sub", "en")
            ], false);
            return;
        }
        // 창의 버블 단계만 듣는다 — 자원(img·link) 로드 오류는 창까지 올라오지 않는다
        window.addEventListener("error", fail);
        window.addEventListener("unhandledrejection", fail);
        slowTimer = setTimeout(showSlow, SLOW_MILLIS);
        // 앱 스크립트는 기능 검사 뒤에 넣는다. webpack 공개 경로는 document.currentScript.src(절대 주소 — /a/<번호>의
        // <base href="/">로 풀린다)로 잡혀 동적으로 넣어도 같다
        var script = document.createElement("script");
        script.src = "animalshelter.js";
        script.onerror = fail;
        document.body.appendChild(script);
    })();
</script>
</body>
</html>
