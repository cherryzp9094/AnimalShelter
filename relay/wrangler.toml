# AnimalShelter 중계 Worker. 규약: docs/design/02-data.md 7절
# 이름·주소는 4b 사용자 답(2026-11-05, docs/design/briefs/phase4b-deploy.md 0절): 이름 animalshelter(Q3),
# 주소 workers.dev(Q2 (a)) → https://animalshelter.<계정 하위 도메인>.workers.dev. 공유 링크(/a/…)·App Links가
# 이 주소에 묶이므로 첫 배포 뒤에는 이름을 바꾸지 않는다. account_id는 두지 않는다(이 맥의 wrangler 로그인 계정 — Q1).
name = "animalshelter"
main = "worker.js"
compatibility_date = "2026-11-01"
# workers.dev 주소로 낸다(기본값에 기대지 않고 명시).
workers_dev = true
# 버전마다 공개 미리보기 주소를 만들지 않는다(4a R4).
preview_urls = false

[vars]
# 로컬 개발용 허용 Origin(쉼표 구분). Worker가 루프백(127.0.0.1·localhost·[::1])에서 돌 때만 쓴다(4a R3) —
# 배포(A안)는 웹 앱과 같은 origin만 허용하므로 이 값이 남아 있어도 localhost가 열리지 않는다.
ALLOWED_ORIGINS = "http://localhost:8080,http://127.0.0.1:8080"
# 사진 변환(5c): binding(Images 바인딩, 기본) | fetch(cf.image — 바인딩이 workers.dev에서 안 될 때) | off(원본만)
IMAGE_ENGINE = "binding"

# Cloudflare Images 바인딩(5c). 무료 5,000 고유 변환/달 — 넘으면 9422, 중계는 원본으로 되돌아간다.
[images]
binding = "IMAGES"

[assets]
directory = "../webApp/build/dist/wasmJs/productionExecutable"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/img/*", "/a/*", "/.well-known/*"]

# 업스트림 URL(serviceKey 포함)이 추적·로그에 남지 않게 끈다.
[observability]
enabled = false

[dev]
# 8787은 이 맥의 다른 프로젝트 서버가 쓴다. 에뮬레이터에서는 http://10.0.2.2:8788
port = 8788
ip = "127.0.0.1"
