# Gradle 데몬 JVM 옵션. 맥 16GB라 Gradle 3GB + Kotlin 데몬 2GB로 둔다(에뮬레이터와 같이 띄우지 않는다).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
# 모듈을 병렬로 빌드하고, 이전 실행 결과를 재사용한다.
org.gradle.parallel=true
org.gradle.caching=true
# 설정 단계 결과를 재사용한다.
org.gradle.configuration-cache=true
# AndroidX 패키지를 쓴다.
android.useAndroidX=true
# 모듈마다 자기 리소스만 담은 R 클래스를 만든다.
android.nonTransitiveRClass=true
# Kotlin 공식 코드 스타일.
kotlin.code.style=official
# 공유 링크·App Links 호스트(브리핑 4a L1). 비면 매니페스트 호스트는 자리값 animalshelter.invalid(어디로도 풀리지
# 않아 검증이 늘 실패하고 다른 링크를 가로채지 않는다)이고 공유 버튼이 없다. -PshareHost=…로 덮어쓴다.
# 4b(2026-11-05): 배포 주소 https://animalshelter.mulddae.workers.dev — 이미 보낸 링크·App Links 검증이 이 호스트에 묶인다.
shareHost=animalshelter.mulddae.workers.dev
